name: Build and test Npp Lite
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build native x64 editor
        run: msbuild PowerEditor/visual.net/notepadPlus.sln /m /p:Configuration=Release /p:Platform=x64 /p:RunCodeAnalysis=false /v:minimal
      - name: Build native plugin ABI probe
        shell: cmd
        run: tests\build-probes.cmd
      - name: Install official Markdown Panel for acceptance
        shell: pwsh
        run: |
          ./deploy/install-panel.ps1 -EditorDirectory PowerEditor/bin64
          New-Item -ItemType Directory -Force PowerEditor/bin64/plugins/Config | Out-Null
          "[Options]`nAutoShowPanel=0`nShowToolbar=0`nShowStatusbar=0`nRenderingEngine=EDGE" | Set-Content -Encoding ascii PowerEditor/bin64/plugins/Config/NppMarkdownPanel.ini
          Copy-Item PowerEditor/bin64/notepad++.exe PowerEditor/bin64/npp-lite.exe
          New-Item -ItemType File PowerEditor/bin64/doLocalConf.xml | Out-Null
      - name: Verify native editing, 80 retired commands and rendered plugin
        run: python tests/windows-smoke.py PowerEditor/bin64/npp-lite.exe test-output
      - name: Package verified EXE and complete official plugin
        shell: pwsh
        run: |
          $exe = Get-Item PowerEditor/bin64/npp-lite.exe
          if ($exe.Length -ge 10000000) { throw "EXE exceeds strict 10 MB limit: $($exe.Length) bytes" }
          New-Item -ItemType Directory -Force dist/portable/plugins/Config | Out-Null
          Copy-Item $exe.FullName dist/npp-lite.exe
          Copy-Item $exe.FullName dist/portable/npp-lite.exe
          Copy-Item PowerEditor/bin64/plugins/NppMarkdownPanel dist/portable/plugins/ -Recurse
          "[Options]`nAutoShowPanel=1`nShowToolbar=0`nShowStatusbar=0`nRenderingEngine=EDGE" | Set-Content -Encoding ascii dist/portable/plugins/Config/NppMarkdownPanel.ini
          New-Item -ItemType File dist/portable/doLocalConf.xml | Out-Null
          Copy-Item LICENSE dist/portable/LICENSE.txt
          Copy-Item README.md dist/portable/README.md
          Copy-Item docs/removed-commands.md dist/portable/removed-commands.md
          Compress-Archive -Path dist/portable/* -DestinationPath dist/npp-lite-x64-portable.zip
          $hash = (Get-FileHash dist/npp-lite.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash dist/npp-lite-x64-portable.zip -Algorithm SHA256).Hash.ToLower()
          @("$hash  npp-lite.exe", "$zipHash  npp-lite-x64-portable.zip") | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          @{project='Npp Lite';version='1.1.0';commit=$env:GITHUB_SHA;upstream='67eca422e60a169801a9aaeb19e285b7f27cfd13';build='GitHub Actions windows-2025 MSVC Release x64';bytes=$exe.Length;sha256=$hash;portableSha256=$zipHash;packed=$false;retiredCommands=80;hostToolbarButtons=8;plugin='Markdown Panel 0.9.3 x64';run="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"} | ConvertTo-Json | Set-Content -Encoding utf8 dist/build-receipt.json
          Copy-Item test-output/smoke.json dist/
          Copy-Item test-output/native-editor-panel.png dist/
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item docs/removed-commands.md dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: test-output/*
      - uses: actions/upload-artifact@v4
        with:
          name: npp-lite-x64
          path: |
            dist/npp-lite.exe
            dist/npp-lite-x64-portable.zip
            dist/*.json
            dist/*.txt
            dist/*.md
            dist/*.png
          if-no-files-found: error
