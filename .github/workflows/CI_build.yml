name: Build and test Markdown Lite
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build native x64 editor
        run: msbuild PowerEditor/visual.net/notepadPlus.sln /m /p:Configuration=Release /p:Platform=x64 /p:RunCodeAnalysis=false /v:minimal
      - name: Core tests and native plugin probe
        shell: cmd
        run: tests\build-probes.cmd
      - name: Real Windows editor integration tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP official-notepad.zip
          curl.exe -fsSL --retry 2 https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.9/npp.8.9.9.portable.x64.zip -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'Official plugin download failed' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '96a8216930f5316ed5961663b2cc92a62ec7d303b6c3077b92a7cfc38a8761b7') { throw 'Official plugin archive hash mismatch' }
          tar.exe -xf $archive -C PowerEditor/bin64 plugins/mimeTools/mimeTools.dll
          if ($LASTEXITCODE -ne 0) { throw 'Official plugin extraction failed' }
          $env:LITE_OFFICIAL_PLUGIN = '1'
          python tests/windows-smoke.py PowerEditor/bin64/notepad++.exe test-output
      - name: Size gate and release evidence
        shell: pwsh
        run: |
          $exe = Get-Item PowerEditor/bin64/notepad++.exe
          if ($exe.Length -ge 10000000) { throw "EXE exceeds strict 10 MB limit: $($exe.Length) bytes" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/npp-markdown-lite.exe
          $hash = (Get-FileHash dist/npp-markdown-lite.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  npp-markdown-lite.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          @{ project='Npp Markdown Lite'; version='1.0.0'; commit=$env:GITHUB_SHA; upstream='67eca422e60a169801a9aaeb19e285b7f27cfd13'; build='GitHub Actions windows-2025 MSVC Release x64'; bytes=$exe.Length; sha256=$hash; packed=$false; run="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json | Set-Content -Encoding utf8 dist/build-receipt.json
          Copy-Item test-output/smoke.json dist/
          Copy-Item LICENSE dist/LICENSE.txt
          if (Test-Path test-output/markdown-light.png) { Copy-Item test-output/markdown-light.png dist/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: test-output/*
      - uses: actions/upload-artifact@v4
        with:
          name: npp-markdown-lite-x64
          path: dist/*
          if-no-files-found: error
